<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timezone & IP Checker - 100% Accurate</title>
    
    <!-- Tailwind CSS for styling without any build tools -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        body {
            background-color: #0b0f16;
            color: #e5e7eb;
            font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        }
        
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 1.25rem;
        }
        
        .divider {
            border-bottom: 1px solid #1f2937;
        }
        
        .divider:last-child {
            border-bottom: none;
        }
        
        .text-value {
            color: #f9fafb;
            font-weight: 600;
            font-size: 1.05rem;
        }
        
        .label-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: #9ca3af;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        /* Custom Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #1f2937;
            color: #fff;
            text-align: center;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 50;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            font-weight: 500;
        }
        
        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.5s;
        }
        
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
        
        @keyframes type-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        
        @keyframes type-wave {
            0% { background-position: 200% auto; }
            100% { background-position: -200% auto; }
        }
        
        .golden-wave-text {
            background-image: linear-gradient(
                -45deg, 
                #d97706 0%, 
                #fbbf24 25%, 
                #fef08a 40%, 
                #ffffff 50%, 
                #fef08a 60%, 
                #fbbf24 75%,
                #d97706 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            display: inline-block;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .animate-type-pop {
            animation: type-pop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards, type-wave 2.5s linear infinite;
        }
    </style>
</head>
<body class="p-2 md:p-8 flex flex-col items-center min-h-screen pt-4 pb-8">

    <!-- Search Area (Outside Card) -->
    <div class="w-full max-w-[440px] mb-3 flex gap-2">
        <form id="searchForm" onsubmit="event.preventDefault(); searchIP();" class="relative flex-grow">
            <input type="text" id="ipSearchInput" placeholder="Enter IP address to check..." class="w-full bg-[#111827] border border-gray-700 text-sm text-gray-300 rounded-[1rem] px-4 py-3 shadow-lg focus:outline-none focus:border-blue-500 transition-colors placeholder-gray-600">
            <button type="submit" class="absolute right-2 top-2 p-1.5 text-gray-500 hover:text-blue-500 transition-colors">
                <i data-lucide="search" class="w-4 h-4"></i>
            </button>
        </form>
        <button onclick="fetchData()" id="reloadBtn" class="flex flex-shrink-0 items-center justify-center gap-1.5 bg-orange-600 hover:bg-orange-500 border border-orange-500 text-white rounded-[1rem] px-5 shadow-lg transition-colors focus:outline-none group font-semibold text-sm">
            <i data-lucide="refresh-cw" class="w-4 h-4 group-active:scale-95 transition-transform"></i> Refresh
        </button>
    </div>

    <!-- Main Card Container -->
    <div class="card w-full max-w-[440px] flex flex-col shadow-2xl overflow-hidden">
        
        <!-- Header / Score Area -->
        <div class="p-4 relative">
            <div class="flex items-baseline justify-between gap-3 mt-1">
                <div class="text-5xl font-extrabold tracking-tight leading-none" id="score">0%</div>
                <div id="usage-status" class="text-sm font-bold text-gray-500 whitespace-nowrap tracking-wide leading-none text-right">CHECKING...</div>
            </div>
            
            <!-- Dynamic Progress Bar -->
            <div class="h-1.5 w-full bg-gray-800 mt-4 rounded-full overflow-hidden">
                <div id="score-bar" class="h-full bg-blue-500 w-0 transition-all duration-1000 ease-out"></div>
            </div>
        </div>

        <!-- Details List -->
        <div id="details-list" class="flex flex-col border-t border-gray-800 bg-[#0d1117]/50 text-sm"></div>

        <!-- Footer Synced status -->
        <div class="p-3 px-5 flex justify-between items-center bg-[#111827] border-t border-gray-800 rounded-b-[1.25rem]">
            <div class="flex items-center gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-gray-500 shadow-[0_0_8px_rgba(34,197,94,0)] transition-all duration-500" id="sync-dot"></div>
                <div class="text-[0.6rem] font-bold text-gray-400 tracking-[0.1em]" id="sync-text">WAITING</div>
            </div>
            <div class="text-[0.8rem] font-mono font-medium text-gray-300 tracking-wide" id="current-time">--:--:--</div>
        </div>
    </div>

    <!-- Toast Component -->
    <div id="toast">Copied to clipboard</div>

    <script>
        // Init Lucide Icons globally
        lucide.createIcons();

        // Object cache for easy copying
        let globalData = {};
        
        // Supabase configuration
        const SUPABASE_URL = 'https://tibnmcjnuzkibkoaluwl.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYm5tY2pudXpraWJrb2FsdXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MDMyNzIsImV4cCI6MjA5MzI3OTI3Mn0.eRNIedq5wO3LcHnvCW7fFrqkVj07MxZ5oW-cERkmFXM';
        const SUPABASE_TABLE = 'ips'; // Assumed table name for checking Usage

        // Detect OS and assign accurate icon
        const getOS = () => {
            const p = navigator.platform, u = navigator.userAgent;
            if (/Mac/.test(p)) return 'Mac OS';
            if (/Win/.test(p)) return 'Windows';
            if (/iPhone|iPad|iPod/.test(p)) return 'iOS';
            if (/Android/.test(u)) return 'Android';
            if (/Linux/.test(p)) return 'Linux';
            return 'Unknown System';
        };

        const setupOS = () => {
            const osName = getOS();
            document.getElementById('os').innerText = osName;
            
            const osIcon = document.getElementById('os-icon');
            if(osName === 'Android' || osName === 'iOS') {
                osIcon.setAttribute('data-lucide', 'smartphone');
            } else {
                osIcon.setAttribute('data-lucide', 'monitor');
            }
            lucide.createIcons();
        };

        // Live clock running in the footer
        setInterval(() => {
            const now = new Date();
            let options = {
                hour12: false, 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit'
            };
            if (globalData && globalData.timezone && globalData.timezone !== 'Unknown') {
                try {
                    options.timeZone = globalData.timezone;
                } catch(e) {}
            }
            document.getElementById('current-time').innerText = now.toLocaleTimeString('en-US', options);
        }, 1000);
        
        function searchIP() {
            const val = document.getElementById('ipSearchInput').value.trim();
            fetchData(val);
        }

        async function checkSupabaseUsedStatus(ip) {
            const usageEl = document.getElementById('usage-status');
            if (usageEl) {
                usageEl.innerText = "CHECKING DB...";
                usageEl.style.color = '#9ca3af';
            }
            let isUsed = false;
            
            try {
                // Check if IP exists
                const res = await fetch(`${SUPABASE_URL}${SUPABASE_TABLE}?ip=eq.${ip}&select=created_at&limit=1`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    if(data && data.length > 0) {
                        // IP has been used
                        let dateStr = "PREVIOUSLY USED";
                        if(data[0].created_at) {
                            const parsed = new Date(data[0].created_at);
                            if(!isNaN(parsed)) {
                                const diffS = Math.floor((new Date() - parsed) / 1000);
                                if (diffS < 60) dateStr = diffS <= 10 ? "USED JUST NOW" : `USED ${diffS}S AGO`;
                                else if (diffS < 3600) dateStr = `USED ${Math.floor(diffS/60)}M AGO`;
                                else if (diffS < 86400) dateStr = `USED ${Math.floor(diffS/3600)}H AGO`;
                                else dateStr = `USED ${Math.floor(diffS/86400)}D AGO`;
                            }
                        }
                        if (usageEl) {
                            usageEl.innerText = dateStr;
                            usageEl.style.color = "#ef4444";
                        }
                        isUsed = true;
                    } else {
                        // IP is fresh/unused
                        if (usageEl) {
                            usageEl.innerText = "UNUSED";
                            usageEl.style.color = "#10b981";
                        }
                        
                        // Insert as used now
                        fetch(`${SUPABASE_URL}${SUPABASE_TABLE}`, {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=minimal, resolution=ignore-duplicates'
                            },
                            body: JSON.stringify({ ip: ip })
                        }).catch(e => console.log('Insert failed (maybe table missing)', e));
                    }
                } else {
                    if (usageEl) {
                        usageEl.innerText = "UNUSED";
                        usageEl.style.color = "#10b981";
                    }
                }
            } catch (e) {
                console.error("Supabase error", e);
                if (usageEl) {
                    usageEl.innerText = "UNUSED";
                    usageEl.style.color = "#10b981";
                }
            }
            return isUsed;
        }

        // Core data fetching logic (IPv4 & IPv6 supported)
        async function fetchData(targetIp = "") {
            const btn = document.getElementById('reloadBtn');
            const btnIcon = btn ? btn.querySelector('svg, i') : null;
            
            // Activate Loading State
            if (btnIcon) btnIcon.classList.add('animate-spin');
            const syncDot = document.getElementById('sync-dot');
            syncDot.className = 'w-1.5 h-1.5 rounded-full bg-gray-500 shadow-[0_0_8px_rgba(34,197,94,0)] transition-all duration-500';
            document.getElementById('sync-text').innerText = 'CHECKING...';
            
            const scoreEl = document.getElementById('score');
            scoreEl.innerText = '0%';
            scoreEl.style.color = '#6b7280';
            
            const scoreBar = document.getElementById('score-bar');
            scoreBar.style.width = '0%';
            scoreBar.style.backgroundColor = '#6b7280';
            
            const usageEl = document.getElementById('usage-status');
            if(usageEl) {
                usageEl.innerText = 'CHECKING...';
                usageEl.style.color = '#9ca3af';
            }

            const fields = ['ip', 'ip_type', 'asn', 'city', 'country', 'region', 'os', 'isp', 'timezone'];
            fields.forEach(f => {
                const el = document.getElementById(f);
                if(el) el.innerText = 'Loading...';
            });
            
            let queryUrlAdd = targetIp ? `/${targetIp}` : '';
            if(queryUrlAdd.startsWith('//')) queryUrlAdd = queryUrlAdd.substring(1);
            
            const guessIPType = (isp, security) => {
                if (security?.vpn || security?.proxy || security?.tor) return "VPN/Proxy";
                if (security?.hosting) return "Datacenter";
                
                const lower = (isp || '').toLowerCase();
                const dct = ['cloud','host','datacenter','aws','amazon','google','digitalocean','azure','linode','ovh','hetzner','alibaba','tencent'];
                const mob = ['mobile','cell','wireless','vodafone','t-mobile','o2','orange','airtel','jio','banglalink','grameenphone','robi','teletalk','at&t','verizon'];
                
                for(let k of dct) if(lower.includes(k)) return "Datacenter";
                for(let k of mob) if(lower.includes(k)) return "Mobile";
                if(lower.includes('edu') || lower.includes('university') || lower.includes('college')) return "Education";
                
                return "Residential";
            };

            try {
                let data = null;
                const providers = [
                    async () => fetch(`https://ipwho.is${queryUrlAdd}`).then(r => r.json()).then(j => {
                        if (!j.success) throw new Error();
                        const isp = j.connection?.isp || j.connection?.org;
                        return { ip: j.ip, asn: String(j.connection?.asn||'Unknown').replace(/^AS/i, ''), city: j.city, countryFull: j.country, countryShort: j.country_code, region: j.region, isp: isp||'Unknown', timezone: j.timezone?.id, proxy: j.security?.proxy||false, vpn: j.security?.vpn||false, tor: j.security?.tor||false, hosting: j.security?.hosting||false, ip_type: guessIPType(isp, j.security) };
                    }),
                    async () => fetch(`https://ipapi.co/${targetIp||''}/json/`.replace('//j', '/j')).then(r => r.json()).then(j => {
                        if (j.error) throw new Error();
                        return { ip: j.ip, asn: String(j.asn||'Unknown').replace(/^AS/i, ''), city: j.city, countryFull: j.country_name || j.country, countryShort: j.country_code || j.country, region: j.region, isp: j.org||'Unknown', timezone: j.timezone, proxy: false, vpn: false, tor: false, ip_type: guessIPType(j.org, null) };
                    }),
                    async () => fetch(`https://get.geojs.io/v1/ip/geo${targetIp?`/${targetIp}`:''}.json`).then(r => r.json()).then(j => {
                        return { ip: j.ip, asn: String(j.asn||'Unknown').replace(/^AS/i, ''), city: j.city, countryFull: j.country, countryShort: j.country_code, region: j.region, isp: j.organization_name||'Unknown', timezone: j.timezone, proxy: false, vpn: false, tor: false, ip_type: guessIPType(j.organization_name, null) };
                    })
                ];

                for (const provider of providers) {
                    try {
                        data = await provider();
                        if (data && data.ip) break; // Found valid data
                    } catch (e) {
                        console.warn('Provider failed check:', e);
                    }
                }

                if (!data || !data.ip) {
                    throw new Error('All IP providers failed or were blocked');
                }

                globalData = data;

                // Sync data into DOM
                const isIPv6 = (data.ip || '').includes(':');
                const ipVersion = isIPv6 ? 'IPv6' : 'IPv4';
                
                const ipRow = document.getElementById('row-ip');
                const ipLabel = document.getElementById('label-ip');
                const ipEl = document.getElementById('ip');
                const ipValContainer = document.getElementById('val-container-ip');

                ipLabel.innerHTML = `IP ADDRESS <span class="bg-gray-700/80 border border-gray-600/80 px-1.5 py-0.5 rounded text-[0.75rem] font-sans font-bold uppercase tracking-widest text-gray-200 ml-2 align-middle shadow-sm leading-none inline-block">${ipVersion}</span>`;

                if (isIPv6) {
                    ipRow.className = "py-2 px-4 divider flex flex-col items-start justify-center gap-2 hover:bg-white/[0.02] transition-colors";
                    ipValContainer.className = "w-full flex items-center justify-between gap-3 min-w-0";
                    ipEl.className = "text-value text-[11px] sm:text-[13px] text-left whitespace-nowrap font-mono tracking-tighter m-0 p-0 flex-1 overflow-visible";
                    ipEl.innerHTML = data.ip || 'Unknown';
                } else {
                    ipRow.className = "py-2.5 px-4 divider flex items-start justify-between gap-3 hover:bg-white/[0.02] transition-colors";
                    ipValContainer.className = "flex items-start justify-end gap-2 w-full pt-0.5 min-w-0";
                    ipEl.className = "text-value text-[0.95rem] leading-tight text-right font-mono tracking-tight break-words";
                    ipEl.innerHTML = data.ip || 'Unknown';
                }
                
                let typeIcon = 'tag';
                switch (data.ip_type) {
                    case 'Mobile': typeIcon = 'smartphone'; break;
                    case 'Datacenter': typeIcon = 'server'; break;
                    case 'Business': typeIcon = 'briefcase'; break;
                    case 'Education': typeIcon = 'graduation-cap'; break;
                    case 'VPN/Proxy': typeIcon = 'shield-alert'; break;
                    case 'Residential': typeIcon = 'home'; break;
                }
                const ipTypeEl = document.getElementById('ip_type');
                ipTypeEl.innerHTML = `<span class="flex items-center justify-end gap-2"><span class="golden-wave-text animate-type-pop">${data.ip_type || 'Unknown'}</span> <i data-lucide="${typeIcon}" class="w-4 h-4 text-blue-400 flex-shrink-0"></i></span>`;

                document.getElementById('asn').innerText = data.asn || 'Unknown';
                document.getElementById('city').innerText = data.city || 'Unknown';
                
                const cFull = data.countryFull || 'Unknown';
                const cShort = data.countryShort || 'Unknown';
                document.getElementById('country').innerHTML = `<span id="country-text" data-full="${cFull}" data-short="${cShort}" class="truncate inline-block align-middle">${cFull}</span> <button onclick="toggleCountry()" class="ml-1 p-1 hover:bg-gray-800 rounded transition-colors text-gray-500 hover:text-white inline-flex align-middle focus:outline-none" title="Toggle full/short name"><i data-lucide="arrow-right-left" class="w-3 h-3"></i></button>`;
                
                document.getElementById('region').innerText = data.region || 'Unknown';
                document.getElementById('isp').innerText = data.isp || 'Unknown';
                document.getElementById('timezone').innerText = data.timezone || 'Unknown';
                
                setupOS(); // Reset OS flag from browser agent
                lucide.createIcons();
                const isUsed = await checkSupabaseUsedStatus(data.ip);

                // 2. Calculate Anonymity Score
                calculateScore(data, isUsed);

            } catch (error) {
                console.error("Failed to load IP details", error);
                const errFields = ['ip', 'ip_type', 'asn', 'city', 'country', 'region', 'os', 'isp', 'timezone'];
                errFields.forEach(f => {
                    const el = document.getElementById(f);
                    if(el) el.innerText = 'Error';
                });
                document.getElementById('sync-text').innerText = "ERROR";
            } finally {
                if (btnIcon) btnIcon.classList.remove('animate-spin');
            }
        }

        // Logic for comparing System Time vs IP Time & Computing Score
        function calculateScore(ipData, isUsed) {
            // Get local machine timezone directly from browser Intl API
            const sysTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const ipTimezone = ipData.timezone;
            
            let score = 100;
            let colorHex = "#10b981"; // Emerald green
            
            // Deductions
            if (sysTimezone !== ipTimezone) {
                score -= 20; // 20% penalty for timezone mismatch
            }
            
            if (isUsed) {
                score -= 10; // 10% penalty if IP was used before
            }
            
            if (ipData.proxy || ipData.tor || ipData.vpn || ipData.hosting) {
                score -= 40; // 40% penalty for suspected proxy/vpn/hosting
            }
            
            // Adjust texts and colors based on score
            if (score === 100) {
                colorHex = "#10b981"; // Green
            } else if (score >= 70) {
                colorHex = "#f59e0b"; // Orange/Yellow
            } else {
                colorHex = "#ef4444"; // Red for highly suspicious
            }
            
            const scoreEl = document.getElementById('score');
            const bar = document.getElementById('score-bar');
            
            const syncDot = document.getElementById('sync-dot');
            const syncText = document.getElementById('sync-text');

            // Apply to DOM
            scoreEl.innerText = score + "%";
            scoreEl.style.color = colorHex;
            
            bar.style.width = score + "%";
            bar.style.backgroundColor = colorHex;
            
            syncDot.style.backgroundColor = colorHex;
            syncDot.style.boxShadow = score >= 90 ? `0 0 8px ${colorHex}b3` : 'none';
            syncText.innerText = score >= 90 ? "SYNCED" : "FLAGGED";
        }

        function toggleCountry() {
            const span = document.getElementById('country-text');
            if (!span) return;
            const current = span.innerText;
            const full = span.getAttribute('data-full');
            const short = span.getAttribute('data-short');
            span.innerText = current === full ? short : full;
        }

        // Function allowing click-to-copy
        function copyText(id) {
            let text = '';
            if (id === 'ip') {
                text = globalData ? globalData.ip : '';
            } else if (id === 'asn') {
                text = globalData ? globalData.asn : '';
            } else if (id === 'country') {
                const cText = document.getElementById('country-text');
                text = cText ? cText.innerText : document.getElementById(id).innerText;
            } else if (id === 'ip_type') {
                text = globalData ? globalData.ip_type : '';
            } else {
                text = document.getElementById(id).innerText;
            }

            if(text && text !== '...' && text !== 'Unknown') {
                if (id === 'timezone') {
                    if (text.includes('/')) {
                        text = text.split('/').pop().replace(/_/g, ' ');
                    }
                }
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                });
            }
        }

        // Toast display handler
        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2800);
        }

        const fieldsCfg = [
            { id: 'ip', label: 'IP ADDRESS', icon: 'wifi', mono: true },
            { id: 'ip_type', label: 'TYPE', icon: 'tag' },
            { id: 'asn', label: 'ASN', icon: 'shield', mono: true, copy: true },
            { id: 'timezone', label: 'TIMEZONE', icon: 'clock', copy: true },
            { id: 'city', label: 'CITY', icon: 'map-pin' },
            { id: 'country', label: 'COUNTRY', icon: 'globe' },
            { id: 'region', label: 'REGION', icon: 'map' },
            { id: 'os', label: 'OS', icon: 'monitor' },
            { id: 'isp', label: 'ISP', icon: 'server', trunc: true }
        ];

        const rowHTML = (f) => `
            <div class="py-2.5 px-4 divider flex items-start justify-between gap-3 hover:bg-white/[0.02] transition-colors" id="row-${f.id}">
                <div class="flex items-center gap-2 mt-0.5">
                    <i data-lucide="${f.icon}" class="text-gray-400 w-4 h-4 flex-shrink-0" id="${f.id}-icon"></i>
                    <div class="label-text mb-0 mt-[1px]" id="label-${f.id}">${f.label}</div>
                </div>
                <div class="flex items-start justify-end gap-2 pt-0.5 min-w-0 w-full" id="val-container-${f.id}">
                    <div class="text-value text-[0.95rem] leading-tight text-right break-words ${f.mono ? 'font-mono tracking-tight' : ''} ${f.trunc ? 'truncate max-w-[200px]' : 'w-full max-w-[240px]'}" id="${f.id}">...</div>
                    ${f.copy ? `<button onclick="copyText('${f.id}')" class="p-1.5 bg-gray-700/60 hover:bg-gray-600 border border-gray-500/50 rounded-md transition-colors text-gray-300 hover:text-white outline-none shadow-sm flex-shrink-0 -mt-0.5" title="Copy"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>` : ''}
                </div>
            </div>`;

        const group1 = fieldsCfg.slice(0, 4);
        const group2 = fieldsCfg.slice(4);

        document.getElementById('details-list').innerHTML = `
            <div class="border border-gray-800/80 rounded-xl mx-2 my-2 overflow-hidden">
                ${group1.map(rowHTML).join('')}
            </div>
            <div class="flex flex-col pb-1">
                ${group2.map(rowHTML).join('')}
            </div>`;
            
        lucide.createIcons();
