<html lang="en">

    <!-- Lucide Icons (Minified for data saving) -->

    <!-- Google Fonts -->
    <style>
      body {
        background-color: #0b0f16;
        color: #e5e7eb;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }

      .card {
        background-color: #111827;
        border: 1px solid #1f2937;
        border-radius: 1.25rem;
      }

      .divider {
        border-bottom: 1px solid #1f2937;
      }

      .divider:last-child {
        border-bottom: none;
      }

      .text-value {
        color: #f9fafb;
        font-weight: 600;
        font-size: 1.05rem;
      }

      .label-text {
        font-size: 0.65rem;
        font-weight: 800;
        color: #9ca3af;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }

      /* Custom Toast Notification */
      #toast {
        visibility: hidden;
        min-width: 250px;
        background-color: #1f2937;
        color: #fff;
        text-align: center;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 12px;
        position: fixed;
        z-index: 50;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        font-size: 14px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        font-weight: 500;
      }

      #toast.show {
        visibility: visible;
        animation:
          fadein 0.3s,
          fadeout 0.3s 2.5s;
      }

      @keyframes fadein {
        from {
          bottom: 0;
          opacity: 0;
        }
        to {
          bottom: 30px;
          opacity: 1;
        }
      }

      @keyframes fadeout {
        from {
          bottom: 30px;
          opacity: 1;
        }
        to {
          bottom: 0;
          opacity: 0;
        }
      }

      @keyframes type-pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.4);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes type-wave {
        0% {
          background-position: 200% auto;
        }
        100% {
          background-position: -200% auto;
        }
      }

      .golden-wave-text {
        background-image: linear-gradient(
          -45deg,
          #d97706 0%,
          #fbbf24 25%,
          #fef08a 40%,
          #ffffff 50%,
          #fef08a 60%,
          #fbbf24 75%,
          #d97706 100%
        );
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        display: inline-block;
        font-weight: 800;
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
      }

      .animate-type-pop {
        animation:
          type-pop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards,
          type-wave 2.5s linear infinite;
      }
    </style>
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body class="p-2 md:p-8 flex flex-col items-center min-h-screen pt-4 pb-8">
    <!-- Cloudflare Turnstile Overlay -->
    <div id="cf-overlay" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center font-sans text-gray-800 transition-opacity duration-300">
      <div class="max-w-md w-full p-6 bg-white border border-gray-200 rounded-lg shadow-sm mx-4 flex flex-col items-center">
        <h1 class="text-2xl font-semibold mb-2 text-gray-900 leading-tight text-center">Checking if the site connection is secure</h1>
        <p class="text-gray-600 mb-6 text-sm text-center">We need to review the security of your connection before proceeding.</p>
        
        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-callback="cfCallback"></div>
        
        <div class="text-xs text-gray-400 text-center select-none pt-6 mt-4 w-full border-t border-gray-100">
          Performance & security by Cloudflare
        </div>
      </div>
    </div>
    
    <!-- Search Area (Outside Card) -->
    <div class="w-full max-w-[440px] mb-10 flex gap-2">
      <form
        id="searchForm"
        onsubmit="
          event.preventDefault();
          searchIP();
        "
        class="relative flex-grow"
      >
        <input
          type="text"
          id="ipSearchInput"
          placeholder="Enter IP address to check..."

        />
        <button
          type="submit"
          class="absolute right-2 top-2 p-1.5 text-gray-500 hover:text-blue-500 transition-colors"
        >
          <i data-lucide="search" class="w-4 h-4"></i>
        </button>
      </form>
      <button
        onclick="fetchData()"
        id="reloadBtn"
        class="flex flex-shrink-0 items-center justify-center gap-1.5 bg-orange-600 hover:bg-orange-500 border border-orange-500 text-white rounded-[1rem] px-5 shadow-lg transition-colors focus:outline-none group font-semibold text-sm"
      >
        <i
          data-lucide="refresh-cw"
          class="w-4 h-4 group-active:scale-95 transition-transform"

        Refresh

    </div>

    <!-- Main Card Container -->
    <div class="relative w-full max-w-[440px]">
      <!-- Ribbon Badge -->
      <div id="usage-ribbon-container" class="absolute -top-1 -right-3.5 z-30 filter drop-shadow-xl select-none opacity-0 pointer-events-none transition-opacity duration-300">
        <div
          id="usage-status"
          class="bg-gray-600 text-white font-bold py-1.5 tracking-wider text-[0.75rem] transition-colors duration-300 shadow-sm"
          style="clip-path: polygon(0 0, 100% 0, 100% 100%, 15px 100%); padding-left: 24px; padding-right: 12px;"
        >

        <div 
          id="usage-fold" 
          class="absolute top-full right-0 w-3.5 h-3 bg-gray-800 transition-colors duration-300" 
          style="clip-path: polygon(0 0, 100% 0, 0 100%);"
        ></div>
      </div>
      
      <div
        class="card w-full flex flex-col shadow-2xl overflow-hidden"
      >
        <!-- Header / Score Area -->
        <div class="px-5 pt-3 pb-2 relative">
          <div class="flex items-end justify-between">
            <div
              class="text-[2.75rem] font-extrabold tracking-tight leading-[0.9] flex items-baseline"
              id="score"
            >
              0<span class="text-[2rem] font-bold opacity-70 ml-1">%</span>
            </div>
            
            <div id="top-country-display" class="flex flex-row items-center gap-1.5 opacity-0 transition-opacity duration-500 mb-0.5">
               <span id="country-flag" class="text-[1.2rem] leading-none filter drop-shadow">🏳️</span>
               <div class="flex items-baseline gap-1">
                 <span id="country-name" class="text-[0.9rem] font-bold tracking-tight text-gray-300 hover:text-white transition-colors cursor-pointer truncate max-w-[150px]" onclick="toggleCountry()" title="Toggle short/full name">...</span>
               </div>
               <button onclick="openCountryModal()" class="ml-0.5 p-1 hover:bg-gray-700/50 rounded transition-colors text-gray-500 hover:text-white flex items-center justify-center focus:outline-none" title="View all countries (A-Z)">
                   <i data-lucide="chevron-down" class="w-4 h-4"></i>
               </button>
            </div>
          </div>
  
          <!-- Dynamic Progress Bar -->

            <div class="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden">
              <div

        <!-- Details List -->

        <!-- Footer Synced status -->
        <div

              WAITING
            </div>
          </div>
          <div
            class="text-[0.8rem] font-mono font-medium text-gray-300 tracking-wide"
            id="current-time"
          >
            --:--:--

        </div>
      </div>

      <!-- Digital Persona Card -->
      <div class="mt-4 bg-[#111827] border border-gray-800 rounded-[1.25rem] shadow-2xl p-4 flex flex-col items-center justify-center relative overflow-hidden group min-h-[90px]">
         <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 via-purple-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
         
         <!-- Setup State -->

            <div class="text-[0.65rem] font-bold text-gray-400 tracking-[0.25em] uppercase mb-1">Set Up Persona</div>
            <div class="flex gap-2 w-full justify-center">

            </div>
            <button onclick="savePersonaPrefs()" class="px-3 py-1 bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white border border-blue-500/30 text-xs font-bold rounded-lg transition-colors mt-1">Generate</button>
         </div>

         <!-- Display State -->
         <div id="persona-display" class="hidden flex-col items-center w-full z-10">
           <button onclick="showPersonaSetup()" class="absolute left-3 top-3 text-gray-500 hover:text-purple-400 transition-colors z-20" title="Settings">

           <div class="flex gap-3 mt-2 text-gray-500">
             <button onclick="generateNewPersona()" class="px-3 py-1 bg-gray-800/80 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700/50 rounded-md text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm" title="Change Name">

    </div>

    <!-- Toast Component -->
    <div id="toast">Copied to clipboard</div>

    <!-- Country Modal -->
    <div
      id="country-modal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 opacity-0 pointer-events-none transition-opacity duration-300 backdrop-blur-sm"
    >
      <div
        class="bg-[#111827] border border-gray-800 rounded-2xl w-full max-w-[380px] max-h-[85vh] flex flex-col shadow-2xl transform scale-95 transition-transform duration-300"
        id="country-modal-inner"
      >
        <div
          class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#0d1117] rounded-t-2xl"

            ALL COUNTRIES & TERRITORIES
          </h3>

        <div class="p-2 border-b border-gray-800 bg-[#0d1117]">
          <input
            type="text"
            id="country-search"
            oninput="filterCountries()"
            placeholder="Search countries..."
            class="w-full bg-[#1f2937] text-white text-sm px-3 py-2 border border-gray-700/50 rounded-lg focus:outline-none focus:border-blue-500 transition-colors placeholder-gray-500"
          />
        </div>
        <div
          id="country-list"
          class="overflow-y-auto flex-1 p-2 space-y-1"
          style="scrollbar-width: thin; scrollbar-color: #374151 transparent"
        >
          <!-- populates here -->
        </div>
      </div>
    </div>

    <script>
      // Cloudflare check functions
      function cfCallback(token) {
        if (token) {
          sessionStorage.setItem('cf_verified', 'true');
          const overlay = document.getElementById('cf-overlay');
          overlay.style.opacity = '0';
          document.body.style.overflow = 'auto';
          setTimeout(() => {
             overlay.style.display = 'none';
          }, 300);
        }
      }

      function initCloudflareCheck() {
        const overlay = document.getElementById('cf-overlay');
        if (sessionStorage.getItem('cf_verified')) {
          overlay.style.display = 'none';
          document.body.style.overflow = 'auto';
        } else {
          document.body.style.overflow = 'hidden';
        }
      }

      // Init Lucide Icons globally
      lucide.createIcons();

      // Object cache for easy copying
      let globalData = {};

      // Supabase configuration
      const SUPABASE_URL = "https://tibnmcjnuzkibkoaluwl.supabase.co/rest/v1/";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYm5tY2pudXpraWJrb2FsdXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MDMyNzIsImV4cCI6MjA5MzI3OTI3Mn0.eRNIedq5wO3LcHnvCW7fFrqkVj07MxZ5oW-cERkmFXM";
      const SUPABASE_TABLE = "ips"; // Assumed table name for checking Usage

      // Detect OS and assign accurate icon
      const getOS = () => {
        const p = navigator.platform,
          u = navigator.userAgent;
        if (/Mac/.test(p)) return "Mac OS";
        if (/Win/.test(p)) return "Windows";
        if (/iPhone|iPad|iPod/.test(p)) return "iOS";
        if (/Android/.test(u)) return "Android";
        if (/Linux/.test(p)) return "Linux";
        return "Unknown System";
      };

      const setupOS = () => {
        const osName = getOS();
        document.getElementById("os").innerText = osName;

        const osIcon = document.getElementById("os-icon");
        if (osName === "Android" || osName === "iOS") {
          osIcon.setAttribute("data-lucide", "smartphone");
        } else {
          osIcon.setAttribute("data-lucide", "monitor");
        }
        lucide.createIcons();
      };

      // Live clock running in the footer
      setInterval(() => {
        const now = new Date();
        let options = {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        };
        if (
          globalData &&
          globalData.timezone &&
          globalData.timezone !== "Unknown"
        ) {
          try {
            options.timeZone = globalData.timezone;
          } catch (e) {}
        }
        document.getElementById("current-time").innerText =
          now.toLocaleTimeString("en-US", options);
      }, 1000);

      function searchIP() {
        const val = document.getElementById("ipSearchInput").value.trim();
        fetchData(val);
      }

      function updateUsageUI(text, mainColor, foldColor, show = true) {
        const container = document.getElementById("usage-ribbon-container");
        const usageEl = document.getElementById("usage-status");
        const foldEl = document.getElementById("usage-fold");

        if (container) {
          if (show) {
            container.classList.remove("opacity-0", "pointer-events-none");
          } else {
            container.classList.add("opacity-0", "pointer-events-none");
          }
        }

        if (usageEl && text) {
          usageEl.innerText = text;
          if (mainColor) usageEl.style.backgroundColor = mainColor;
          usageEl.style.color = "#ffffff";
        }
        if (foldEl && foldColor) {
          foldEl.style.backgroundColor = foldColor;
        }
      }

      async function checkSupabaseUsedStatus(ip) {
        updateUsageUI(null, null, null, false);
        let isUsed = false;

        try {
          // Check if IP exists
          const res = await fetch(
            `${SUPABASE_URL}${SUPABASE_TABLE}?ip=eq.${ip}&select=created_at&limit=1`,
            {
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              },
            },
          );

          if (res.ok) {
            const data = await res.json();
            if (data && data.length > 0) {
              // IP has been used
              let dateStr = "PREVIOUSLY USED";
              if (data[0].created_at) {
                const parsed = new Date(data[0].created_at);
                if (!isNaN(parsed)) {
                  const diffS = Math.floor((new Date() - parsed) / 1000);
                  if (diffS < 60)
                    dateStr =
                      diffS <= 10 ? "USED JUST NOW" : `USED ${diffS}S AGO`;
                  else if (diffS < 3600)
                    dateStr = `USED ${Math.floor(diffS / 60)}M AGO`;
                  else if (diffS < 86400)
                    dateStr = `USED ${Math.floor(diffS / 3600)}H AGO`;
                  else dateStr = `USED ${Math.floor(diffS / 86400)}D AGO`;
                }
              }
              updateUsageUI(dateStr, "#ef4444", "#991b1b"); // red-500, red-800
              isUsed = true;
            } else {
              // IP is fresh/unused
              updateUsageUI("UNUSED", "#10b981", "#047857"); // emerald-500, emerald-700

              // Insert as used now
              fetch(`${SUPABASE_URL}${SUPABASE_TABLE}`, {
                method: "POST",
                headers: {
                  apikey: SUPABASE_ANON_KEY,
                  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
                  "Content-Type": "application/json",
                  Prefer: "return=minimal, resolution=ignore-duplicates",
                },
                body: JSON.stringify({ ip: ip }),
              }).catch((e) =>
                console.log("Insert failed (maybe table missing)", e),
              );
            }
          } else {
            updateUsageUI("UNUSED", "#10b981", "#047857");
          }
        } catch (e) {
          console.error("Supabase error", e);
          updateUsageUI("UNUSED", "#10b981", "#047857");
        }
        return isUsed;
      }

      // Core data fetching logic (IPv4 & IPv6 supported)
      window.currentIpData = null;
      window.personaGenderPref = localStorage.getItem('personaGenderPref') || null;
      window.personaAgePref = localStorage.getItem('personaAgePref') || null;

      async function fetchData(targetIp = "") {
        const btn = document.getElementById("reloadBtn");
        const btnIcon = btn ? btn.querySelector("svg, i") : null;

        // Activate Loading State
        if (btnIcon) btnIcon.classList.add("animate-spin");
        const syncDot = document.getElementById("sync-dot");
        syncDot.className =
          "w-1.5 h-1.5 rounded-full bg-gray-500 shadow-[0_0_8px_rgba(34,197,94,0)] transition-all duration-500";
        document.getElementById("sync-text").innerText = "CHECKING...";

        const scoreEl = document.getElementById("score");
        scoreEl.innerHTML = `0<span class="text-[2rem] font-bold opacity-70 ml-1">%</span>`;
        scoreEl.style.color = "#6b7280";

        const scoreBar = document.getElementById("score-bar");
        scoreBar.style.width = "0%";
        scoreBar.style.backgroundColor = "#6b7280";

        updateUsageUI(null, null, null, false);

        const personaEl = document.getElementById("digital-persona");
        const factorsEl = document.getElementById("persona-factors");
        if (personaEl) {
           personaEl.classList.add("opacity-0", "translate-y-2");
           personaEl.innerText = "Loading Identity...";
        }
        if (factorsEl) factorsEl.classList.add("opacity-0");

        const fields = [
          "ip",
          "ip_type",
          "asn",
          "city",
          "region",
          "os",
          "isp",
          "timezone",
        ];
        fields.forEach((f) => {
          const el = document.getElementById(f);
          if (el) el.innerText = "Loading...";
        });
        
        const topCountryDisplay = document.getElementById("top-country-display");
        if (topCountryDisplay) topCountryDisplay.classList.add("opacity-0");

        let queryUrlAdd = targetIp ? `/${targetIp}` : "";
        if (queryUrlAdd.startsWith("//"))
          queryUrlAdd = queryUrlAdd.substring(1);

        const guessIPType = (isp, security) => {
          if (security?.vpn || security?.proxy || security?.tor)
            return "VPN/Proxy";
          if (security?.hosting) return "Datacenter";

          const lower = (isp || "").toLowerCase();
          const dct = [
            "cloud",
            "host",
            "datacenter",
            "aws",
            "amazon",
            "google",
            "digitalocean",
            "azure",
            "linode",
            "ovh",
            "hetzner",
            "alibaba",
            "tencent",
          ];
          const mob = [
            "mobile",
            "cell",
            "wireless",
            "vodafone",
            "t-mobile",
            "o2",
            "orange",
            "airtel",
            "jio",
            "banglalink",
            "grameenphone",
            "robi",
            "teletalk",
            "at&t",
            "verizon",
          ];

          for (let k of dct) if (lower.includes(k)) return "Datacenter";
          for (let k of mob) if (lower.includes(k)) return "Mobile";
          if (
            lower.includes("edu") ||
            lower.includes("university") ||
            lower.includes("college")
          )
            return "Education";

          return "Residential";
        };

        try {
          let data = null;
          const providers = [
            async () =>
              fetch(`https://ipwho.is${queryUrlAdd}`)
                .then((r) => r.json())

      function calculateScore(ipData, isUsed) {
        // Get local machine timezone directly from browser Intl API
        const sysTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const ipTimezone = ipData.timezone;

        let score = 100;
        let colorHex = "#10b981"; // Emerald green

        // Deductions
        if (sysTimezone !== ipTimezone) {
          score -= 20; // 20% penalty for timezone mismatch
        }

        if (isUsed) {
          score -= 10; // 10% penalty if IP was used before
        }

        if (ipData.proxy || ipData.tor || ipData.vpn || ipData.hosting) {
          score -= 40; // 40% penalty for suspected proxy/vpn/hosting
        }

        // Adjust texts and colors based on score
        if (score === 100) {
          colorHex = "#10b981"; // Green
        } else if (score >= 70) {
          colorHex = "#f59e0b"; // Orange/Yellow
        } else {
          colorHex = "#ef4444"; // Red for highly suspicious
        }

        const scoreEl = document.getElementById("score");
        const bar = document.getElementById("score-bar");

        const syncDot = document.getElementById("sync-dot");
        const syncText = document.getElementById("sync-text");

        // Apply to DOM
        scoreEl.innerHTML = `${score}<span class="text-[2rem] font-bold opacity-70 ml-1">%</span>`;
        scoreEl.style.color = colorHex;

        bar.style.width = score + "%";
        bar.style.backgroundColor = colorHex;

        syncDot.style.backgroundColor = colorHex;
        syncDot.style.boxShadow =
          score >= 90 ? `0 0 8px ${colorHex}b3` : "none";
        syncText.innerText = score >= 90 ? "SYNCED" : "FLAGGED";
      }

      function seededRandom(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        hash = Math.abs(hash);
        return function() {
          let t = hash += 0x6d2b79f5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function initPersonaUI() {
        if (!window.currentIpData) return;
        if (window.personaGenderPref) {
            document.getElementById("persona-setup").classList.add("hidden");
            document.getElementById("persona-setup").classList.remove("flex");
            document.getElementById("persona-display").classList.remove("hidden");
            document.getElementById("persona-display").classList.add("flex");
            generateNewPersona();
        } else {
            document.getElementById("persona-display").classList.add("hidden");
            document.getElementById("persona-display").classList.remove("flex");
            document.getElementById("persona-setup").classList.remove("hidden");
            document.getElementById("persona-setup").classList.add("flex");
        }
      }

      function showPersonaSetup() {
        document.getElementById("persona-display").classList.add("hidden");
        document.getElementById("persona-display").classList.remove("flex");
        document.getElementById("persona-setup").classList.remove("hidden");
        document.getElementById("persona-setup").classList.add("flex");
      }

      function savePersonaPrefs() {
        const gender = document.getElementById("persona-gender").value;
        const age = document.getElementById("persona-age").value;
        
        window.personaGenderPref = gender;
        window.personaAgePref = age;
        localStorage.setItem("personaGenderPref", gender);
        if (age) localStorage.setItem("personaAgePref", age);
        
        initPersonaUI();
      }

      function generateNewPersona() {
        if (!window.currentIpData) return;
        const ipData = window.currentIpData;
        
        const osName = getOS().toLowerCase();
        let osVibe = "standard";
        let titles = [];
        
        if (osName.includes("mac") || osName.includes("ios") || osName.includes("iphone") || osName.includes("ipad")) {
          osVibe = "rich";
          titles = ["The Elite", "The Tycoon", "The Visionary", "Duke", "Baron", "Lord"];
        } else if (osName.includes("win")) {
          osVibe = "standard";
          titles = ["The Professional", "The Executive", "The Strategist", "Director"];
        } else if (osName.includes("linux") || osName.includes("ubuntu")) {
          osVibe = "tech";
          titles = ["The Hacker", "The Wizard", "Root", "The Mastermind", "Coder"];
        } else {
          osVibe = "standard";
          titles = ["The Explorer", "The Nomad", "The Citizen", "The Guide"];
        }

        const cc = ipData.countryShort ? ipData.countryShort.toUpperCase() : "UNKNOWN";
        const regionKey = getRegionInfo(cc);
        const nameData = namesByRegion[regionKey] || namesByRegion["Global"];

        const firstNamesM = nameData.firstM || nameData.first;
        const firstNamesF = nameData.firstF || nameData.first;

        const gender = window.personaGenderPref || "male";
        const firstNamesList = gender === "female" ? firstNamesF : firstNamesM;
        
        let lastNames;
        if (osVibe === "rich") {
            lastNames = (gender === "female" && nameData.richMatchF) ? nameData.richMatchF : ((gender === "male" && nameData.richMatchM) ? nameData.richMatchM : nameData.richMatch);
        } else {
            lastNames = (gender === "female" && nameData.standardMatchF) ? nameData.standardMatchF : ((gender === "male" && nameData.standardMatchM) ? nameData.standardMatchM : nameData.standardMatch);
        }
        
        const firstName = firstNamesList[Math.floor(Math.random() * firstNamesList.length)] || "Unknown";
        const lastName = lastNames[Math.floor(Math.random() * lastNames.length)] || "Entity";
        
        let finalName = `${firstName} ${lastName}`;
        const useComplex = Math.random() > 0.4;

        if (useComplex) {
            let m;
            let safety = 10;
            do {
                m = firstNamesList[Math.floor(Math.random() * firstNamesList.length)];
                safety--;
            } while (m === firstName && safety > 0);
            
            let l2;
            safety = 10;
            do {
                l2 = lastNames[Math.floor(Math.random() * lastNames.length)];
                safety--;
            } while (l2 === lastName && safety > 0);

            if (m !== firstName && l2 !== lastName) {
                switch (regionKey) {
                    case "LatinAmerica":
                    case "Colombia":
                        finalName = Math.random() > 0.5 ? `${firstName} ${m} ${lastName}` : `${firstName} ${lastName} ${l2}`;
                        break;
                    case "EastAsia":
                        finalName = `${firstName} ${lastName}`;
                        break;
                    case "Bangladesh":
                    case "Pakistan":
                    case "SouthAsia":
                        if (gender === "female") {
                            finalName = `${firstName} ${lastName} ${m}`;
                        } else {
                            finalName = Math.random() > 0.5 ? `${firstName} ${lastName} ${m}` : `${firstName} ${m} ${lastName}`;
                        }
                        break;
                    default:
                        finalName = `${firstName} ${m} ${lastName}`;
                }
            }
        }

        const personaEl = document.getElementById("digital-persona");
        
        if (personaEl) {
          personaEl.innerText = finalName;
          personaEl.classList.remove("opacity-0", "translate-y-2");
        }
      }

      function toggleCountry() {
        const span = document.getElementById("country-name");
        if (!span) return;
        const current = span.innerText;
        const full = span.getAttribute("data-full");
        const short = span.getAttribute("data-short");
        span.innerText = current === full ? short : full;
      }

      function getFlagEmojiLocal(cc) {
        if (!cc || cc === "UN" || cc === "Unknown") return "🏳️";
        return cc
          .toUpperCase()
          .replace(/./g, (char) =>
            String.fromCodePoint(char.charCodeAt(0) + 127397),
          );
      }

      let isCountryListRendered = false;

      function openCountryModal() {
        const modal = document.getElementById("country-modal");
        const inner = document.getElementById("country-modal-inner");
        
        if (!isCountryListRendered) {
          const listObj = window.countryMap || {};
          const listEl = document.getElementById("country-list");

          const arr = Object.entries(listObj).sort((a, b) =>
            a[0].localeCompare(b[0]),
          );
          listEl.innerHTML = arr
            .map(
              ([name, code]) => `
                  <div class="country-item flex items-center justify-between p-2 rounded-lg hover:bg-white/[0.04] cursor-pointer transition-colors group select-none flex-shrink-0" data-name="${name.toLowerCase()}" onclick="this.querySelector('.short-code').classList.toggle('hidden')">
                      <div class="flex items-center gap-3 w-full pr-2">
                          <div class="text-[1.35rem] leading-none filter drop-shadow select-none">${getFlagEmojiLocal(code)}</div>
                          <div class="text-[0.9rem] text-gray-300 group-hover:text-white flex-1 country-name transition-colors break-words whitespace-normal text-left">${name}</div>
                      </div>
                      <div class="short-code hidden bg-gray-800/80 px-1.5 py-0.5 rounded text-[0.7rem] text-blue-400 font-mono tracking-wider flex-shrink-0 border border-gray-700/50 shadow-sm transition-all">${code}</div>
                  </div>
              `,
            )
            .join("");
          isCountryListRendered = true;
        }

        document.getElementById("country-search").value = "";
        filterCountries(); // Reset display to show all

        modal.classList.remove("opacity-0", "pointer-events-none");
        inner.classList.remove("scale-95");
        inner.classList.add("scale-100");
      }

      function closeCountryModal() {
        const modal = document.getElementById("country-modal");
        const inner = document.getElementById("country-modal-inner");

        modal.classList.add("opacity-0", "pointer-events-none");
        inner.classList.remove("scale-100");
        inner.classList.add("scale-95");
      }

      function filterCountries() {
        const val = document.getElementById("country-search").value.toLowerCase();
        const items = document.querySelectorAll(".country-item");

        if (val === '') {
            items.forEach(el => el.style.display = 'flex');
            return;
        }

        items.forEach((el) => {
          const name = el.getAttribute("data-name");
          if (name.includes(val)) {
            el.style.display = "flex";
          } else {
            el.style.display = "none";
          }
        });
      }

      // Function allowing click-to-copy
      function copyText(id) {
        let text = "";
        if (id === "ip") {
          text = globalData ? globalData.ip : "";
        } else if (id === "asn") {
          text = globalData ? globalData.asn : "";
        } else if (id === "country") {
          const cText = document.getElementById("country-text");
          text = cText
            ? cText.innerText
            : document.getElementById(id).innerText;
        } else if (id === "ip_type") {
          text = globalData ? globalData.ip_type : "";
        } else {
          text = document.getElementById(id).innerText;
        }

        if (text && text !== "..." && text !== "Unknown") {
          if (id === "timezone") {
            if (text.includes("/")) {
              text = text.split("/").pop().replace(/_/g, " ");
            }
          }
          navigator.clipboard.writeText(text).then(() => {
            showToast();
          });
        }
      }

      // Toast display handler
      function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(() => {
          toast.className = toast.className.replace("show", "");
        }, 2800);
      }

      const fieldsCfg = [
        { id: "ip", label: "IP ADDRESS", icon: "wifi", mono: true },
        { id: "ip_type", label: "TYPE", icon: "tag" },
        { id: "asn", label: "ASN", icon: "shield", mono: true, copy: true },
        { id: "timezone", label: "TIMEZONE", icon: "clock", copy: true },
        { id: "city", label: "CITY", icon: "map-pin" },
        { id: "region", label: "REGION", icon: "map" },
        { id: "os", label: "OS", icon: "monitor" },
        { id: "isp", label: "ISP", icon: "server" },
      ];

      const rowHTML = (f) => `
            <div class="py-2.5 px-4 divider flex items-start justify-between gap-3 hover:bg-white/[0.02] transition-colors" id="row-${f.id}">
                <div class="flex items-center gap-2 mt-0.5">
                    <i data-lucide="${f.icon}" class="text-gray-400 w-4 h-4 flex-shrink-0" id="${f.id}-icon"></i>
                    <div class="label-text mb-0 mt-[1px]" id="label-${f.id}">${f.label}</div>
                </div>
                <div class="flex items-start justify-end gap-2 pt-0.5 min-w-0 w-full" id="val-container-${f.id}">
                    <div class="text-value text-[0.95rem] leading-tight text-right break-words ${f.mono ? "font-mono tracking-tight" : ""} ${f.trunc ? "truncate max-w-[200px]" : "w-full max-w-[240px]"}" id="${f.id}">...</div>
                    ${f.copy ? `<button onclick="copyText('${f.id}')" class="p-1.5 bg-gray-700/60 hover:bg-gray-600 border border-gray-500/50 rounded-md transition-colors text-gray-300 hover:text-white outline-none shadow-sm flex-shrink-0 -mt-0.5" title="Copy"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>` : ""}
                </div>
            </div>`;

      const group1 = fieldsCfg.slice(0, 4);
      const group2 = fieldsCfg.slice(4);

      document.getElementById("details-list").innerHTML = `
            <div class="border border-gray-800/80 rounded-xl mx-2 my-2 overflow-hidden">
                ${group1.map(rowHTML).join("")}
            </div>
            <div class="flex flex-col pb-1">
                ${group2.map(rowHTML).join("")}
            </div>`;

      lucide.createIcons();

      // Kickoff logic on page load
      initCloudflareCheck();
      setupOS();
      fetchData();
    </script>
  </body>
</html>
